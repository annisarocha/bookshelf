<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jeruk Bookshelf</title>
<style>
/* Put your font files in a "fonts" folder next to this file */
@font-face{font-family:'Modern Prestige';src:url("fonts/Modern Prestige DEMO.otf") format("opentype");font-display:swap}
@font-face{font-family:'Creato';src:url("fonts/CreatoDisplay-Medium.otf") format("opentype");font-weight:100 900;font-display:swap}
:root{
  --kraft:#efd9a7; --paper:#fffaf0; --ink:#552a0b; --red:#cd5534; --gold:#fa9147; --tape:#fa914788;
  --display:'Modern Prestige',Georgia,serif; --sans:'Creato',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0}
body{background:var(--kraft);color:var(--ink);font-family:var(--sans);line-height:1.55;min-height:100svh;display:grid;place-items:center;padding:48px 24px;overflow-x:hidden}
:focus-visible{outline:3px solid var(--red);outline-offset:3px}

.page{display:grid;gap:44px;align-items:center;max-width:960px;width:100%}
@media(min-width:820px){.page{grid-template-columns:5fr 6fr;gap:72px}}

/* Taped polaroid */
.photo{position:relative;background:var(--paper);padding:14px 14px 56px;box-shadow:0 8px 22px #552a0b33;transform:rotate(-4deg);width:min(340px,82vw);justify-self:center}
.photo img{display:block;width:100%;aspect-ratio:1;object-fit:cover}
.photo::before,.tape::before{content:"";position:absolute;top:-14px;left:50%;width:96px;height:28px;background:var(--tape);transform:translateX(-50%) rotate(3deg)}
.photo figcaption{position:absolute;bottom:16px;left:0;right:0;text-align:center}

/* Text */
.text{position:relative}
.hello{display:inline-block;background:var(--ink);color:var(--kraft);padding:2px 12px;transform:rotate(-2deg)}
h1{font-family:var(--display);font-weight:400;font-size:clamp(4rem,15vw,9rem);line-height:.95;margin:14px 0 26px}
.note{position:relative;background:var(--paper);padding:22px 24px;max-width:44ch;transform:rotate(1.2deg);box-shadow:0 6px 16px #552a0b26}
.note.tape::before{top:-13px;left:24px;transform:rotate(-5deg)}
.links{display:flex;flex-wrap:wrap;gap:20px 28px;align-items:center;margin-top:34px}
.go{background:var(--red);color:var(--paper);padding:14px 28px;border-radius:6px;text-decoration:none;font-size:1.1rem;transform:rotate(-2deg);box-shadow:3px 3px 0 var(--ink);transition:transform .15s,box-shadow .15s}
.go:hover{transform:rotate(0) translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.ig{color:var(--ink)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="page">
  <figure class="photo">
    <img src="assets/landing.png" alt="" onerror="this.closest('figure').remove()">
    <figcaption>my shelf</figcaption>
  </figure>

  <div class="text">
    <span class="hello">Welcome to</span>
    <h1>Jeruk Bookshelf</h1>
    <p class="note tape">Welcome to my personal bookshelf!</p>
    <div class="links">
      <a class="go" href="bookshelf.html">Browse shelves</a>
      <!-- Change yourhandle to your Instagram name, or delete this whole line -->
      <a class="ig" href="https://instagram.com/_anisaocha" target="_blank" rel="noopener">@_anisoacha</a>
    </div>
  </div>
</main>
</body>
</html>
